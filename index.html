<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>void.exe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#07070c;
    --card-bg:rgba(16,16,24,0.55);
    --card-border:rgba(255,255,255,0.08);
    --cyan:#00e5ff;
    --magenta:#ff2e88;
    --text:#e8e8f0;
    --muted:#8b8b9e;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    cursor:none;
  }

  /* ---------- CONFIG-DRIVEN BACKGROUND ---------- */
  #bg-canvas{
    position:fixed; inset:0; width:100%; height:100%; z-index:0;
  }
  #bg-media{
    position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    z-index:0; display:none; filter:brightness(0.35) saturate(1.1);
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(circle at 50% 40%, transparent 0%, rgba(7,7,12,0.7) 75%, rgba(7,7,12,0.95) 100%);
  }
  .scanlines{
    position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0.05;
    background:repeating-linear-gradient(0deg, #fff 0px, transparent 1px, transparent 2px, #fff 3px);
  }

  /* ---------- CURSOR ---------- */
  #cursor-canvas{ position:fixed; inset:0; z-index:50; pointer-events:none; }
  #cursor-dot{
    position:fixed; width:8px; height:8px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 10px var(--cyan), 0 0 20px var(--cyan);
    z-index:51; pointer-events:none; transform:translate(-50%,-50%);
    transition:width .15s, height .15s;
  }

  /* ---------- LAYOUT ---------- */
  .stage{
    position:relative; z-index:10; height:100vh; display:flex;
    align-items:center; justify-content:center; padding:24px;
  }

  .card{
    position:relative;
    width:380px; max-width:100%;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:32px 26px 24px;
    text-align:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 20px 60px rgba(0,0,0,0.6);
    animation:card-in .7s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes card-in{
    from{opacity:0; transform:translateY(18px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .avatar-wrap{
    position:relative; width:96px; height:96px; margin:0 auto 18px;
  }
  .avatar-ring{
    position:absolute; inset:-6px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--cyan));
    animation:spin 4s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .avatar{
    position:relative; width:96px; height:96px; border-radius:50%;
    background:#111 center/cover no-repeat;
    border:3px solid var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono',monospace; font-size:28px; color:var(--muted);
  }

  .badges{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
  .badge{
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.05em;
    padding:3px 8px; border-radius:20px; border:1px solid var(--card-border);
    color:var(--muted); background:rgba(255,255,255,0.03);
  }
  .badge.on{ color:var(--cyan); border-color:rgba(0,229,255,0.35); }

  /* glitch username */
  .username{
    position:relative; display:inline-block;
    font-family:'Space Mono',monospace; font-weight:700; font-size:26px;
    letter-spacing:.02em; color:var(--text); margin-bottom:4px;
  }
  .username::before, .username::after{
    content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    overflow:hidden; background:transparent;
  }
  .username::before{
    color:var(--cyan); z-index:-1; animation:glitch-1 4.5s infinite linear;
  }
  .username::after{
    color:var(--magenta); z-index:-2; animation:glitch-2 4.5s infinite linear;
  }
  @keyframes glitch-1{
    0%,92%,100%{ clip-path:inset(0 0 0 0); transform:translate(0,0); }
    93%{ clip-path:inset(10% 0 60% 0); transform:translate(-2px,-1px); }
    95%{ clip-path:inset(60% 0 5% 0); transform:translate(2px,1px); }
    97%{ clip-path:inset(30% 0 40% 0); transform:translate(-1px,1px); }
  }
  @keyframes glitch-2{
    0%,92%,100%{ clip-path:inset(0 0 0 0); transform:translate(0,0); }
    93%{ clip-path:inset(50% 0 10% 0); transform:translate(2px,1px); }
    95%{ clip-path:inset(5% 0 70% 0); transform:translate(-2px,-1px); }
    97%{ clip-path:inset(40% 0 20% 0); transform:translate(1px,-1px); }
  }

  .pronouns{ font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:14px; }

  .bio{ font-size:13.5px; line-height:1.6; color:var(--muted); margin-bottom:18px; }

  .stats{
    display:flex; justify-content:center; gap:18px; margin-bottom:20px;
    font-family:'Space Mono',monospace; font-size:11px; color:var(--muted);
  }
  .stats span b{ color:var(--text); display:block; font-size:14px; }

  .socials{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .social{
    width:38px; height:38px; border-radius:9px;
    border:1px solid var(--card-border); background:rgba(255,255,255,0.03);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); text-decoration:none; transition:.2s;
  }
  .social:hover{
    color:var(--cyan); border-color:rgba(0,229,255,0.4);
    box-shadow:0 0 14px rgba(0,229,255,0.25); transform:translateY(-2px);
  }
  .social svg{ width:17px; height:17px; }

  /* ---------- MUSIC WIDGET ---------- */
  .music{
    position:fixed; bottom:20px; left:20px; z-index:20;
    display:flex; align-items:center; gap:10px;
    background:rgba(16,16,24,0.6); border:1px solid var(--card-border);
    backdrop-filter:blur(12px); border-radius:30px; padding:8px 14px 8px 8px;
  }
  .music button{
    width:30px; height:30px; border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--cyan),var(--magenta));
    color:#07070c; display:flex; align-items:center; justify-content:center;
    cursor:none; font-size:12px;
  }
  .music .track{
    font-family:'Space Mono',monospace; font-size:10px; color:var(--muted);
    max-width:140px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .eq{ display:flex; gap:2px; align-items:flex-end; height:12px; }
  .eq span{ width:2px; background:var(--cyan); animation:eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s; }
  .eq span:nth-child(3){ animation-delay:.3s; }
  @keyframes eq{ 0%,100%{ height:3px; } 50%{ height:11px; } }
  .eq.paused span{ animation-play-state:paused; height:3px; }

  .viewport-tag{
    position:fixed; top:16px; left:16px; z-index:20;
    font-family:'Space Mono',monospace; font-size:10px; color:var(--muted);
    letter-spacing:.08em; opacity:.6;
  }

  @media (max-width:420px){
    .card{ padding:26px 18px 20px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<video id="bg-media" autoplay muted loop playsinline></video>
<div class="vignette"></div>
<div class="scanlines"></div>
<canvas id="cursor-canvas"></canvas>
<div id="cursor-dot"></div>

<div class="viewport-tag">SYS://ONLINE</div>

<div class="stage">
  <div class="card">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar" id="avatar">?</div>
    </div>

    <div class="badges" id="badges"></div>

    <div class="username" id="username" data-text="void.exe">void.exe</div>
    <div class="pronouns" id="pronouns">// they / them</div>

    <div class="bio" id="bio">
      arquiteto de interfaces quebradas. vive entre linhas de código e ruído estático.
    </div>

    <div class="stats">
      <span>VIEWS<b id="views">···</b></span>
      <span>JOINED<b id="joined">2024</b></span>
      <span>STATUS<b style="color:var(--cyan)">ONLINE</b></span>
    </div>

    <div class="socials" id="socials"></div>
  </div>
</div>

<div class="music">
  <button id="playBtn">▶</button>
  <div>
    <div class="track" id="trackName">sem faixa configurada</div>
    <div class="eq paused" id="eq"><span></span><span></span><span></span></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — edite aqui para personalizar o perfil
   ============================================================ */
const CONFIG = {
  username: "kysa",
  pronouns: "ela/dela",
  bio: "Gatos, jogos, programação e animes.",
  avatarUrl: "https://img.magnific.com/fotos-gratis/retrato-em-close-up-de-um-belo-gato_23-2149214419.jpg?semt=ais_hybrid&w=740&q=80", // deixe vazio para usar iniciais
  joined: "2024",
  badges: [
    { label: "OWNER", on: true },
    { label: "OG", on: true },
    { label: "VERIFIED", on: false }
  ],
  background: {
    type: "particles", // "particles" | "image" | "video"
    src: "https://png.pngtree.com/thumb_back/fh260/background/20230426/pngtree-orange-cat-laying-down-on-wooden-floor-indoor-free-images-wallpaper-image_2526996.jpg"             // url da imagem/vídeo quando type != "particles"
  },
  music: {
    src: "",             // url do mp3 (deixe vazio para desativar)
    name: "sem faixa configurada"
  },
  socials: [
    { name: "Discord",  url: "https://discord.com",  icon: "discord" },
    { name: "X",        url: "https://x.com",        icon: "x" },
    { name: "Instagram",url: "https://instagram.com",icon: "instagram" },
    { name: "GitHub",   url: "https://github.com",   icon: "github" },
    { name: "Telegram", url: "https://telegram.org", icon: "telegram" }
  ]
};

/* ============================================================
   RENDER PROFILE FROM CONFIG
   ============================================================ */
document.getElementById('username').textContent = CONFIG.username;
document.getElementById('username').dataset.text = CONFIG.username;
document.getElementById('pronouns').textContent = CONFIG.pronouns;
document.getElementById('bio').textContent = CONFIG.bio;
document.getElementById('joined').textContent = CONFIG.joined;

const avatarEl = document.getElementById('avatar');
if(CONFIG.avatarUrl){
  avatarEl.style.backgroundImage = `url(${CONFIG.avatarUrl})`;
  avatarEl.textContent = '';
} else {
  avatarEl.textContent = CONFIG.username.charAt(0).toUpperCase();
}

const badgesEl = document.getElementById('badges');
CONFIG.badges.forEach(b=>{
  const d = document.createElement('div');
  d.className = 'badge' + (b.on ? ' on' : '');
  d.textContent = b.label;
  badgesEl.appendChild(d);
});

const ICONS = {
  discord: '<path d="M20.3 4.9A17.4 17.4 0 0 0 15.9 3.5c-.2.4-.5.9-.6 1.3a16 16 0 0 0-4.6 0c-.2-.4-.4-.9-.6-1.3A17.5 17.5 0 0 0 5.7 4.9C2.9 9 2.1 13 2.5 17a17.6 17.6 0 0 0 5.3 2.6c.4-.6.8-1.2 1.1-1.9-.6-.2-1.2-.5-1.7-.9l.4-.3c3.3 1.5 6.9 1.5 10.2 0l.4.3c-.5.4-1.1.7-1.7.9.3.7.7 1.3 1.1 1.9A17.6 17.6 0 0 0 21.5 17c.5-4.6-.7-8.6-3.2-12.1ZM9.7 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm4.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>',
  x: '<path d="M17.5 3h3l-6.6 7.5L22 21h-6.1l-4.8-6.3L5.6 21H2.6l7-8-8-10h6.2l4.4 5.8L17.5 3Zm-1 16.2h1.7L7.6 4.7H5.8L16.5 19.2Z"/>',
  instagram: '<path d="M12 2c2.7 0 3.1 0 4.1.1 1.1 0 1.8.2 2.5.5.7.3 1.2.6 1.8 1.2.6.6.9 1.1 1.2 1.8.3.7.5 1.4.5 2.5.1 1 .1 1.4.1 4.1s0 3.1-.1 4.1c0 1.1-.2 1.8-.5 2.5-.3.7-.6 1.2-1.2 1.8-.6.6-1.1.9-1.8 1.2-.7.3-1.4.5-2.5.5-1 .1-1.4.1-4.1.1s-3.1 0-4.1-.1c-1.1 0-1.8-.2-2.5-.5-.7-.3-1.2-.6-1.8-1.2-.6-.6-.9-1.1-1.2-1.8-.3-.7-.5-1.4-.5-2.5C2 15.1 2 14.7 2 12s0-3.1.1-4.1c0-1.1.2-1.8.5-2.5.3-.7.6-1.2 1.2-1.8.6-.6 1.1-.9 1.8-1.2.7-.3 1.4-.5 2.5-.5C8.9 2 9.3 2 12 2Zm0 1.8c-2.6 0-2.9 0-4 .1-.9 0-1.4.2-1.7.3-.4.2-.7.4-1 .7-.3.3-.5.6-.7 1-.1.3-.3.8-.3 1.7-.1 1-.1 1.3-.1 4s0 2.9.1 4c0 .9.2 1.4.3 1.7.2.4.4.7.7 1 .3.3.6.5 1 .7.3.1.8.3 1.7.3 1 .1 1.3.1 4 .1s2.9 0 4-.1c.9 0 1.4-.2 1.7-.3.4-.2.7-.4 1-.7.3-.3.5-.6.7-1 .1-.3.3-.8.3-1.7.1-1 .1-1.3.1-4s0-2.9-.1-4c0-.9-.2-1.4-.3-1.7-.2-.4-.4-.7-.7-1-.3-.3-.6-.5-1-.7-.3-.1-.8-.3-1.7-.3-1-.1-1.3-.1-4-.1Zm0 3.5a4.7 4.7 0 1 1 0 9.4 4.7 4.7 0 0 1 0-9.4Zm0 1.8a2.9 2.9 0 1 0 0 5.8 2.9 2.9 0 0 0 0-5.8Zm5-2a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/>',
  github: '<path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1-1.5-1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5a4 4 0 0 1 1-2.7c-.1-.2-.5-1.3.1-2.7 0 0 .9-.3 2.9 1a10 10 0 0 1 5.2 0c2-1.3 2.9-1 2.9-1 .6 1.4.2 2.5.1 2.7a4 4 0 0 1 1 2.7c0 4-2.4 4.8-4.6 5 .3.3.6.9.6 1.9v2.7c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/>',
  telegram: '<path d="M21.5 4.5 3.9 11.3c-1.2.5-1.2 1.2-.2 1.5l4.5 1.4 1.7 5.3c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.1-2 4.4 3.3c.8.5 1.4.2 1.6-.7l2.9-13.7c.3-1.2-.4-1.7-1.2-1.2ZM8.6 14.3l9-5.7c.4-.3.8-.1.5.2L11 15.5l-.2 2.3-1.2-3.5Z"/>'
};

const socialsEl = document.getElementById('socials');
CONFIG.socials.forEach(s=>{
  const a = document.createElement('a');
  a.className = 'social';
  a.href = s.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.title = s.name;
  a.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${ICONS[s.icon] || ''}</svg>`;
  socialsEl.appendChild(a);
});

/* background type switch */
if(CONFIG.background.type !== 'particles' && CONFIG.background.src){
  const media = document.getElementById('bg-media');
  const canvas = document.getElementById('bg-canvas');
  canvas.style.display = 'none';
  media.style.display = 'block';
  if(CONFIG.background.type === 'video'){
    media.src = CONFIG.background.src;
  } else {
    // image: swap video tag for an img-like background via CSS
    media.remove();
    document.body.style.background = `#000 url(${CONFIG.background.src}) center/cover no-repeat`;
  }
}

/* ============================================================
   VIEW COUNTER (persistente, contador compartilhado de demo)
   ============================================================ */
(async () => {
  const el = document.getElementById('views');
  try{
    let current = 0;
    try{
      const res = await window.storage.get('profile-views', true);
      current = res ? parseInt(res.value, 10) || 0 : 0;
    }catch(e){ current = 0; }
    current += 1;
    await window.storage.set('profile-views', String(current), true);
    el.textContent = current.toLocaleString('pt-BR');
  }catch(e){
    el.textContent = '—';
  }
})();

/* ============================================================
   MUSIC PLAYER
   ============================================================ */
const trackNameEl = document.getElementById('trackName');
const eqEl = document.getElementById('eq');
const playBtn = document.getElementById('playBtn');
let audio = null;

trackNameEl.textContent = CONFIG.music.name;

if(CONFIG.music.src){
  audio = new Audio(CONFIG.music.src);
  audio.loop = true;
}

playBtn.addEventListener('click', () => {
  if(!audio){
    trackNameEl.textContent = 'nenhuma faixa configurada';
    return;
  }
  if(audio.paused){
    audio.play().catch(()=>{ trackNameEl.textContent = 'não foi possível reproduzir'; });
    playBtn.textContent = '❚❚';
    eqEl.classList.remove('paused');
  } else {
    audio.pause();
    playBtn.textContent = '▶';
    eqEl.classList.add('paused');
  }
});

/* ============================================================
   BACKGROUND PARTICLES
   ============================================================ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
let bgParticles = [];

function resizeCanvas(){
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  document.getElementById('cursor-canvas').width = window.innerWidth;
  document.getElementById('cursor-canvas').height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initBgParticles(){
  bgParticles = [];
  const count = Math.floor((bgCanvas.width * bgCanvas.height) / 14000);
  for(let i=0;i<count;i++){
    bgParticles.push({
      x: Math.random()*bgCanvas.width,
      y: Math.random()*bgCanvas.height,
      r: Math.random()*1.4 + 0.3,
      vx: (Math.random()-0.5)*0.15,
      vy: (Math.random()-0.5)*0.15,
      c: Math.random() > 0.5 ? '0,229,255' : '255,46,136',
      a: Math.random()*0.5 + 0.15
    });
  }
}
initBgParticles();
window.addEventListener('resize', initBgParticles);

function drawBg(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  bgParticles.forEach(p=>{
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0) p.x = bgCanvas.width;
    if(p.x > bgCanvas.width) p.x = 0;
    if(p.y < 0) p.y = bgCanvas.height;
    if(p.y > bgCanvas.height) p.y = 0;
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    bgCtx.fillStyle = `rgba(${p.c},${p.a})`;
    bgCtx.fill();
  });
  requestAnimationFrame(drawBg);
}
if(CONFIG.background.type === 'particles') drawBg();

/* ============================================================
   CURSOR TRAIL
   ============================================================ */
const cursorCanvas = document.getElementById('cursor-canvas');
const cCtx = cursorCanvas.getContext('2d');
const cursorDot = document.getElementById('cursor-dot');
let trail = [];
let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;

window.addEventListener('mousemove', e=>{
  mouseX = e.clientX; mouseY = e.clientY;
  cursorDot.style.left = mouseX + 'px';
  cursorDot.style.top = mouseY + 'px';
  for(let i=0;i<2;i++){
    trail.push({
      x: mouseX + (Math.random()-0.5)*6,
      y: mouseY + (Math.random()-0.5)*6,
      r: Math.random()*2.5 + 1.5,
      life: 1,
      c: Math.random() > 0.5 ? '0,229,255' : '255,46,136'
    });
  }
});

window.addEventListener('mousedown', ()=>{
  cursorDot.style.width = '16px';
  cursorDot.style.height = '16px';
  for(let i=0;i<18;i++){
    const ang = (Math.PI*2*i)/18;
    trail.push({
      x: mouseX, y: mouseY,
      vx: Math.cos(ang)*3, vy: Math.sin(ang)*3,
      r: 2, life: 1,
      c: Math.random() > 0.5 ? '0,229,255' : '255,46,136',
      burst: true
    });
  }
});
window.addEventListener('mouseup', ()=>{
  cursorDot.style.width = '8px';
  cursorDot.style.height = '8px';
});

function drawTrail(){
  cCtx.clearRect(0,0,cursorCanvas.width,cursorCanvas.height);
  trail.forEach(p=>{
    if(p.burst){ p.x += p.vx; p.y += p.vy; }
    p.life -= 0.02;
    cCtx.beginPath();
    cCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    cCtx.fillStyle = `rgba(${p.c},${p.life*0.6})`;
    cCtx.fill();
  });
  trail = trail.filter(p => p.life > 0);
  requestAnimationFrame(drawTrail);
}
drawTrail();
</script>

</body>
</html>
